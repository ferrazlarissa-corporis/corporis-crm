    // document mints the blobs for its OWN frames, obtaining page text

      // root's never-relay rule) are what hold in fully opaque chains

      // FOREIGN wrapper still fails all three even though both serialize

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;

      for (const el of Array.from(document.querySelectorAll('iframe'))) {

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   /* bola do logo, cards, hover bg */\n\n  /* Verde — exclusivo saúde preventiva / fisio pélvica */\n  --color-verde:      #ACC095;\n\n  /* Neutros — base de trabalho */\n  --color-fundo-claro:   #FAFAF8;   /* NUNCA branco puro */\n  --color-cinza:         #D3D2CD;   /* bordas, divisores */\n  --color-texto-escuro:  #3A3530;   /* texto primário */\n  --color-texto-medio:   #7A6E68;   /* texto secundário */\n  --color-espresso:      #2A1F1A;   /* NUNCA preto puro */\n\n  /* Functional — UI states (aliases) */\n  --color-ui-success:     var(--color-verde);\n  --color-ui-error:       #C0504A;\n  --color-ui-border:      var(--color-cinza);\n  --color-ui-interactive: var(--color-alaranjado);\n  --color-ui-hover:       var(--color-tangerina);\n  --color-ui-disabled:    var(--color-cinza);\n\n  /* Semantic foreground / background aliases */\n  --fg-1: var(--color-texto-escuro);   /* primary text on light */\n  --fg-2: var(--color-texto-medio);    /* secondary text */\n  --fg-on-dark: var(--color-fundo-claro);\n  --bg-1: var(--color-fundo-claro);    /* canvas */\n  --bg-2: #F4EFE6;                     /* warm secondary surface */\n  --bg-card: #FFFFFF;                  /* card surface — ÚNICA exceção a #FFF, apenas cards */\n  --bg-dark: var(--color-espresso);\n  --bg-accent-soft: var(--color-bege-claro);\n  --border-1: var(--color-cinza);\n\n  /* ——————————————————————————————————————————————————————\n     TYPE PRIMITIVES\n     —————————————————————————————————————————————————————— */\n\n  /* Families\n     - Display = \"Olicy Regular\" (substituído por Quicksand) — headlines, wordmark, hero\n     - Body    = \"Ubuntu\"                                   — corpo, labels, UI\n     NUNCA introduzir uma terceira typeface. NUNCA usar Arial/Times/system fonts. */\n  --font-display: \"Olicy\", \"Quicksand\", system-ui, sans-serif;\n  --font-body:    \"Ubuntu\", system-ui, -apple-system, sans-serif;\n\n  /* Display scale — Olicy Regular (400) */\n  --type-display-xl-size:    72px;   /* hero / campanha / wordmark */\n  --type-display-xl-leading: 1.05;\n  --type-display-xl-track:   -0.01em;\n\n  --type-display-lg-size:    48px;   /* títulos de seção, abertura editorial */\n  --type-display-lg-leading: 1.1;\n  --type-display-lg-track:   -0.005em;\n\n  --type-display-md-size:    32px;   /* sub-header, pull quote, título de card */\n  --type-display-md-leading: 1.2;\n  --type-display-md-track:   0;\n\n  /* Body scale — Ubuntu */\n  --type-body-lg-size:    19px;      /* parágrafo de abertura, destaque    (Medium 500) */\n  --type-body-lg-leading: 1.55;\n  --type-body-lg-weight:  500;\n\n  --type-body-md-size:    16px;      /* corpo padrão                       (Regular 400) */\n  --type-body-md-leading: 1.6;\n  --type-body-md-weight:  400;\n\n  --type-body-sm-size:    14px;      /* apoio, footnote, legenda           (Regular 400) */\n  --type-body-sm-leading: 1.55;\n  --type-body-sm-weight:  400;\n\n  /* UI scale — Ubuntu */\n  --type-ui-label-size:    12px;     /* labels, tags, nav — ALL CAPS, +2–3px */\n  --type-ui-label-leading: 1.2;\n  --type-ui-label-weight:  500;\n  --type-ui-label-track:   2.4px;\n\n  --type-ui-value-size:    14px;     /* horários, endereços, contato */\n  --type-ui-value-leading: 1.4;\n  --type-ui-value-weight:  400;\n\n  --type-ui-micro-size:    10px;     /* CRP, avisos legais — ALL CAPS */\n  --type-ui-micro-leading: 1.3;\n  --type-ui-micro-weight:  400;\n  --type-ui-micro-track:   1.6px;\n\n  /* ——————————————————————————————————————————————————————\n     SPACING — grid base 8pt (+ exceção micro 4pt)\n     —————————————————————————————————————————————————————— */\n  --space-none:  0;\n  --space-micro: 4px;\n  --space-xs:    8px;\n  --space-sm:   16px;\n  --space-md:   24px;\n  --space-std:  32px;\n  --space-lg:   40px;\n  --space-xl:   64px;\n  --space-2xl:  96px;\n\n  /* ——————————————————————————————————————————————————————\n     RADIUS — soft, sem cantos vivos\n     —————————————————————————————————————————————————————— */\n  --radius-xs:    4px;   /* badges, labels */\n  --radius-sm:    6px;   /* cards de serviço */\n  --radius-md:    8px;   /* buttons, inputs */\n  --radius-lg:   12px;   /* hero cards, panels */\n  --radius-pill: 999px;  /* tags arredondadas, avatars */\n\n  /* ——————————————————————————————————————————————————————\n     SHADOW — soft, baixa elevação. Nunca drop shadow forte.\n     —————————————————————————————————————————————————————— */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(58, 53, 48, 0.04);\n  --shadow-md: 0 4px 16px rgba(58, 53, 48, 0.06);\n  --shadow-lg: 0 12px 32px rgba(58, 53, 48, 0.08);\n\n  /* ——————————————————————————————————————————————————————\n     MOTION — easings calmos, sem bounces\n     —————————————————————————————————————————————————————— */\n  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);   /* @kind other */\n  --ease-out:  cubic-bezier(0.16, 1, 0.3, 1);   /* @kind other */\n  --duration-fast:  160ms;   /* @kind other */\n  --duration-base:  240ms;   /* @kind other */\n  --duration-slow:  420ms;   /* @kind other */\n}\n\n/* ============================================================\n   SEMANTIC TYPE — aplicação direta de tokens\n   ============================================================ */\n\nhtml, body {\n  background: var(--bg-1);\n  color: var(--fg-1);\n  font-family: var(--font-body);\n  font-size: var(--type-body-md-size);\n  line-height: var(--type-body-md-leading);\n  font-weight: var(--type-body-md-weight);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, .h1, .type-display-xl {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--type-display-xl-size);\n  line-height: var(--type-display-xl-leading);\n  letter-spacing: var(--type-display-xl-track);\n  color: var(--fg-1);\n  margin: 0;\n}\nh2, .h2, .type-display-lg {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--type-display-lg-size);\n  line-height: var(--type-display-lg-leading);\n  letter-spacing: var(--type-display-lg-track);\n  color: var(--fg-1);\n  margin: 0;\n}\nh3, .h3, .type-display-md {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--type-display-md-size);\n  line-height: var(--type-display-md-leading);\n  color: var(--fg-1);\n  margin: 0;\n}\n\np, .type-body-md {\n  font-size: var(--type-body-md-size);\n  line-height: var(--type-body-md-leading);\n  font-weight: var(--type-body-md-weight);\n  color: var(--fg-1);\n  margin: 0;\n  text-wrap: pretty;\n}\n.type-body-lg {\n  font-size: var(--type-body-lg-size);\n  line-height: var(--type-body-lg-leading);\n  font-weight: var(--type-body-lg-weight);\n}\n.type-body-sm {\n  font-size: var(--type-body-sm-size);\n  line-height: var(--type-body-sm-leading);\n  color: var(--fg-2);\n}\n\n.type-ui-label {\n  font-family: var(--font-body);\n  font-size: var(--type-ui-label-size);\n  font-weight: var(--type-ui-label-weight);\n  letter-spacing: var(--type-ui-label-track);\n  text-transform: uppercase;\n  color: var(--color-bege);\n}\n.type-ui-value {\n  font-family: var(--font-body);\n  font-size: var(--type-ui-value-size);\n  font-weight: var(--type-ui-value-weight);\n  color: var(--fg-1);\n}\n.type-ui-micro {\n  font-family: var(--font-body);\n  font-size: var(--type-ui-micro-size);\n  font-weight: var(--type-ui-micro-weight);\n  letter-spacing: var(--type-ui-micro-track);\n  text-transform: uppercase;\n  color: var(--fg-2);\n}\n\na {\n  color: var(--color-ui-interactive);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  transition: color var(--duration-fast) var(--ease-soft);\n}\na:hover { color: var(--color-ui-hover); }\n\n::selection { background: var(--color-bege-claro); color: var(--color-texto-escuro); }\n<\u002Fstyle>\n<style>\n:root{--sidebar-w:264px;--topbar-h:64px;--surface-raised:#FFFFFF;--surface-sunken:var(--bg-2);\n--pillar-diastase:#F08353;--pillar-pelvica:#ACC095;--pillar-postura:#D2B06E;--pillar-gestante:#F6A958;--pillar-terapeutico:#C97448;--pillar-preventiva:#7E9469;--pillar-bastidores:#7A6E68;\n--gate-ok:var(--color-verde);--gate-alert:var(--color-bege);--gate-block:var(--color-ui-error)}\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{height:100%}\nbody{margin:0;background:var(--bg-1);overflow:hidden}\n.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;width:100vw}\n\n/* sidebar (shared shell) */\n.sidebar{background:var(--surface-raised);border-right:0.6px solid var(--color-cinza);display:grid;grid-template-rows:auto 1fr auto;padding:24px 16px 16px;gap:var(--space-md)}\n.sb-logo{padding:8px 12px 4px;display:flex;align-items:center;gap:10px}\n.sb-logo img{width:110px;height:auto;display:block}\n.sb-logo .sb-module{font-family:var(--font-body);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--color-bege);padding:3px 7px;border:0.6px solid var(--color-bege);border-radius:var(--radius-xs)}\n.sb-section-label{font-family:var(--font-body);font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--color-bege);font-weight:500;padding:0 14px 8px}\n.sb-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}\n.sb-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-md);color:var(--color-texto-medio);font-family:var(--font-body);font-size:14px;font-weight:400;text-decoration:none;cursor:pointer;transition:background var(--duration-fast) var(--ease-soft),color var(--duration-fast) var(--ease-soft);position:relative}\n.sb-item svg{width:18px;height:18px;stroke-width:1.5;flex-shrink:0}\n.sb-item:hover{background:var(--color-bege-claro);color:var(--color-texto-escuro)}\n.sb-item.active{background:var(--color-bege-claro);color:var(--color-texto-escuro);font-weight:500}\n.sb-item.active::before{content:\"\";position:absolute;left:0;top:12px;bottom:12px;width:2px;background:var(--color-alaranjado);border-radius:2px}\n.sb-badge{margin-left:auto;background:var(--color-alaranjado);color:#fff;font-size:10px;font-weight:500;letter-spacing:.4px;padding:2px 7px;border-radius:var(--radius-pill);font-feature-settings:\"tnum\"}\n.sb-badge.soft{background:var(--surface-sunken);color:var(--color-texto-medio)}\n.sb-user{display:flex;align-items:center;gap:12px;padding:12px 10px;border-top:0.6px solid var(--color-cinza);margin-top:8px}\n.avatar{width:36px;height:36px;border-radius:var(--radius-pill);background:var(--color-bege-claro);color:var(--color-texto-escuro);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;font-weight:400;flex-shrink:0}\n.sb-user-meta{display:flex;flex-direction:column;min-width:0;flex:1}\n.sb-user-name{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--color-texto-escuro);line-height:1.2}\n.sb-user-role{font-family:var(--font-body);font-size:11px;color:var(--color-texto-medio);line-height:1.3;margin-top:2px}\n.sb-user-action{background:transparent;border:0;color:var(--color-texto-medio);padding:6px;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center}\n.sb-user-action svg{width:16px;height:16px;stroke-width:1.5}\n.sb-user-action:hover{background:var(--color-bege-claro);color:var(--color-texto-escuro)}\n\n/* main shell */\n.main{display:grid;grid-template-rows:var(--topbar-h) 1fr;min-width:0;overflow:hidden}\n.topbar{background:var(--bg-1);border-bottom:0.6px solid var(--color-cinza);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}\n.topbar-left{display:flex;align-items:center;gap:14px;min-width:0}\n.back-btn{width:32px;height:32px;border-radius:var(--radius-pill);border:0.6px solid var(--color-cinza);background:var(--surface-raised);color:var(--color-texto-medio);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color var(--duration-fast) var(--ease-soft),background var(--duration-fast) var(--ease-soft)}\n.back-btn:hover{color:var(--color-alaranjado);background:var(--color-bege-claro)}\n.back-btn svg{width:15px;height:15px;stroke-width:2}\n.topbar-title{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1;color:var(--color-texto-escuro);letter-spacing:-0.005em;white-space:nowrap}\n.topbar-title .sub{display:block;font-family:var(--font-body);font-size:11px;color:var(--color-texto-medio);font-weight:400;margin-top:5px;letter-spacing:0}\n.status-chip{font-family:var(--font-body);font-size:12px;font-weight:500;letter-spacing:.3px;padding:7px 14px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background var(--duration-base) var(--ease-soft),color var(--duration-base) var(--ease-soft)}\n.status-chip .dot{width:8px;height:8px;border-radius:var(--radius-pill);flex-shrink:0}\n.status-chip.pending{background:var(--color-bege-claro);color:var(--color-texto-escuro)}\n.status-chip.pending .dot{background:var(--color-bege)}\n.status-chip.approved{background:var(--color-verde);color:#fff}\n.status-chip.approved .dot{background:#fff}\n\n/* body: feed + side panel */\n.body-grid{display:grid;grid-template-columns:1fr 336px;min-width:0;overflow:hidden}\n.feed-col{overflow-y:auto;padding:32px 24px 40px;display:flex;justify-content:center}\n.feed-card{width:400px;flex-shrink:0;background:var(--surface-raised);border:0.6px solid var(--color-cinza);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;height:fit-content}\n\n.ig-head{display:flex;align-items:center;gap:10px;padding:12px 14px}\n.ig-avatar{width:32px;height:32px;border-radius:var(--radius-pill);object-fit:cover;flex-shrink:0;background:var(--color-bege-claro)}\n.ig-headmeta{display:flex;flex-direction:column;min-width:0;flex:1}\n.ig-handle{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--color-texto-escuro)}\n.ig-loc{font-family:var(--font-body);font-size:11px;colo fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"><\u002Fpath><polyline points=\"22 4 12 14.01 9 11.01\"><\u002Fpolyline><\u002Fsvg>Pronto para aprovar<\u002Fdiv>\n            <div class=\"gate-item\"><span class=\"gate-dot ok\"><\u002Fspan><b>COFFITO<\u002Fb><span class=\"status-word\">Ok<\u002Fspan><\u002Fdiv>\n            <div class=\"gate-item\"><span class=\"gate-dot ok\"><\u002Fspan><b>LGPD<\u002Fb><span class=\"status-word\">Ok<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"meta-field\">\n          <label>Link rastreável<\u002Flabel>\n          <div class=\"link-row\">\n            <input type=\"text\" id=\"trackedLink\" value=\"corporis.com.br/l/dia7f2\" readonly=\"\">\n            <button class=\"copy-btn\" id=\"copyLinkBtn\" aria-label=\"Copiar link\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"divider\"><\u002Fdiv>\n\n        <div class=\"actions\" id=\"actionsCol\">\n          <button class=\"btn-approve\" id=\"approveBtn\">Aprovar post<\u002Fbutton>\n          <button class=\"btn-regen\" id=\"regenBtn\" onclick=\"location.href='22 Conteúdo - Editor de post.html'\">Gerar de novo<\u002Fbutton>\n          <button class=\"btn-reject\" id=\"openRejectBtn\">Reprovar<\u002Fbutton>\n        <\u002Fdiv>\n\n      <\u002Faside>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"toast\" id=\"toast\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"><\u002Fpath><polyline points=\"22 4 12 14.01 9 11.01\"><\u002Fpolyline><\u002Fsvg><span id=\"toastText\">Post aprovado<\u002Fspan><\u002Fdiv>\n\n<script>\n(function(){\n  var ESPRESSO='#2A1F1A';\n  var slides = [\n    {template:'capa', title:'3 sinais de diástase que a maioria ignora', bg:'linear-gradient(150deg,#F08353 0%,'+ESPRESSO+' 100%)'},\n    {template:'conteudo', title:'Sinal 1 — a barriga que não some', body:'Mesmo sem excesso de peso, um abaulamento no meio do abdômen pode indicar diástase — não falta de exercício.', bg:'linear-gradient(160deg,#F08353 0%,#3A3530 65%,'+ESPRESSO+' 100%)'},\n    {template:'conteudo', title:'Sinal 2 — dor lombar sem explicação', body:'A diástase enfraquece o centro do corpo e sobrecarrega a lombar em tarefas simples do dia a dia.', bg:'linear-gradient(172deg,#F08353 0%,#3A3530 65%,'+ESPRESSO+' 100%)'},\n    {template:'conteudo', title:'Sinal 3 — sensação de fraqueza no core', body:'Dificuldade para levantar, tossir ou virar na cama pode ser o abdômen pedindo avaliação.', bg:'radial-gradient(130% 130% at 25% 15%,#F6C79C 0%,#F08353 45%,'+ESPRESSO+' 100%)'},\n    {template:'citacao', title:'\"Fechei a diástase treinando com orientação — não sozinha.\"', body:'— Aluna Corporis, 8 meses pós-parto', bg:'linear-gradient(150deg,#EAD7AC 0%,#F08353 55%,'+ESPRESSO+' 100%)'},\n    {template:'cta', title:'Sua diástase tem tratamento', body:'Agende uma avaliação individual com fisioterapeuta especializada em Xanxerê.', bg:'linear-gradient(150deg,#F08353 0%,'+ESPRESSO+' 100%)', cta:true}\n  ];\n  var idx = 0;\n\n  var carousel = document.getElementById('carousel');\n  var dotsRow = document.getElementById('dotsRow');\n  var counterEl = document.getElementById('slideCounter');\n\n  function render(){\n    carousel.querySelectorAll('.ig-slide').forEach(function(el){el.remove()});\n    slides.forEach(function(s, i){\n      var el = document.createElement('div');\n      el.className = 'ig-slide tpl-'+s.template+(i===idx?' active':'');\n      el.style.background = s.bg;\n      var inner = '';\n      if(s.template==='capa'){\n        inner += '<span class=\"sc-eyebrow\">Diástase abdominal<\u002Fspan>';\n        inner += '<div class=\"sc-title\">'+s.title+'<\u002Fdiv>';\n      } else if(s.template==='conteudo'){\n        inner += '<span class=\"sc-eyebrow\">Diástase abdominal<\u002Fspan>';\n        inner += '<div class=\"sc-title\">'+s.title+'<\u002Fdiv><div class=\"sc-body\">'+s.body+'<\u002Fdiv>';\n      } else if(s.template==='citacao'){\n        inner += '<div class=\"sc-title\">'+s.title+'<\u002Fdiv><div class=\"sc-body\">'+s.body+'<\u002Fdiv>';\n      } else if(s.template==='cta'){\n        inner += '<div class=\"sc-title\">'+s.title+'<\u002Fdiv><div class=\"sc-body\">'+s.body+'<\u002Fdiv><div class=\"ig-cta-pill\">Agendar avaliação<\u002Fdiv>';\n      }\n      el.innerHTML = inner;\n      carousel.insertBefore(el, document.getElementById('prevSlide'));\n    });\n    dotsRow.innerHTML = '';\n    slides.forEach(function(s, i){\n      var dot = document.createElement('span');\n      dot.className = 'ig-dot'+(i===idx?' active':'');\n      dot.addEventListener('click', function(){ idx=i; render(); });\n      dotsRow.appendChild(dot);\n    });\n    counterEl.textContent = (idx+1)+'/'+slides.length;\n  }\n  document.getElementById('prevSlide').addEventListener('click', function(){ idx=(idx-1+slides.length)%slides.length; render(); });\n  document.getElementById('nextSlide').addEventListener('click', function(){ idx=(idx+1)%slides.length; render(); });\n  render();\n\n  document.getElementById('copyLinkBtn').addEventListener('click', function(){\n    var input = document.getElementById('trackedLink');\n    input.select();\n    try{ document.execCommand('copy'); }catch(e){}\n  });\n\n  function showToast(text){\n    var toast = document.getElementById('toast');\n    document.getElementById('toastText').textContent = text;\n    toast.classList.add('show');\n    setTimeout(function(){ toast.classList.remove('show'); }, 2600);\n  }\n\n  document.getElementById('approveBtn').addEventListener('click', function(){\n    var chip = document.getElementById('statusChip');\n    chip.className = 'status-chip approved';\n    document.getElementById('statusWord').textContent = 'Aprovado · Agendado';\n    document.getElementById('approveBtn').disabled = true;\n    var badge = document.getElementById('pendingBadge');\n    var n = parseInt(badge.textContent,10)-1;\n    badge.textContent = n>0 ? n : '0';\n    if(n<=0) badge.style.display='none';\n    showToast('Post aprovado');\n  });\n\n  // reject flow\n  var actionsCol = document.getElementById('actionsCol');\n  document.getElementById('openRejectBtn').addEventListener('click', function(){\n    var panel = document.createElement('div');\n    panel.className = 'reject-panel';\n    panel.id = 'rejectPanel';\n    panel.innerHTML =\n      '<label>Motivo da reprovação<\u002Flabel>'+\n      '<textarea id=\"rejectReason\" placeholder=\"Ex.: linguagem promete resultado rápido, trocar imagem de fundo…\"><\u002Ftextarea>'+\n      '<div class=\"reject-row\"><button class=\"reject-cancel\" id=\"rejectCancel\">Cancelar<\u002Fbutton><button class=\"reject-confirm\" id=\"rejectConfirm\" disabled>Confirmar reprovação<\u002Fbutton><\u002Fdiv>';\n    actionsCol.appendChild(panel);\n    document.getElementById('openRejectBtn').style.display = 'none';\n    document.getElementById('approveBtn').style.display = 'none';\n    document.getElementById('regenBtn').style.display = 'none';\n\n    var reasonEl = document.getElementById('rejectReason');\n    var confirmBtn = document.getElementById('rejectConfirm');\n    reasonEl.addEventListener('input', function(){ confirmBtn.disabled = reasonEl.value.trim().length===0; });\n    document.getElementById('rejectCancel').addEventListener('click', function(){\n      panel.remove();\n      document.getElementById('openRejectBtn').style.display = '';\n      document.getElementById('approveBtn').style.display = '';\n      document.getElementById('regenBtn').style.display = '';\n    });\n    confirmBtn.addEventListener('click', function(){\n      var chip = document.getElementById('statusChip');\n      chip.className = 'status-chip pending';\n      chip.querySelector('.dot').style.background = 'var(--color-ui-error)';\n      document.getElementById('statusWord').textContent = 'Reprovado';\n      panel.remove();\n      document.getElementById('approveBtn').disabled = true;\n      document.getElementById('approveBtn').style.display = '';\n      document.getElementById('regenBtn').style.display = '';\n      showToast('Post reprovado — enviado de volta ao editor');\n    });\n  });\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"

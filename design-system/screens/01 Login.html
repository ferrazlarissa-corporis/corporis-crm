<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Corporis CRM · Entrar</title>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  /* ===== Layout shell ===================================== */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg-1);
    color: var(--fg-1);
    font-family: var(--font-body);
    overflow: hidden;
  }

  .split {
    display: grid;
    grid-template-columns: 55fr 45fr;
    height: 100vh;
    width: 100vw;
  }

  /* ===== Left — painel de marca (Espresso) =============== */
  .brand {
    position: relative;
    background: var(--color-espresso);
    color: var(--fg-on-dark);
    padding: 56px 72px 48px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
    isolation: isolate;
  }

  /* Subtle paper grain texture (~5% opacity) */
  .brand::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(234, 215, 172, 0.04) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 0;
  }

  /* Soft warm wash from upper-left, like morning light */
  .brand::after {
    content: "";
    position: absolute;
    top: -20%; left: -20%;
    width: 80%; height: 80%;
    background: radial-gradient(circle at center, rgba(234, 215, 172, 0.06), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .brand > * { position: relative; z-index: 1; }

  .brand-mark {
    display: flex;
    justify-content: center;
    padding-top: 24px;
  }
  .brand-mark img {
    width: 220px;
    height: auto;
    display: block;
  }

  .brand-center {
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    max-width: 560px;
    margin: 0 auto;
    padding: 0 12px;
    text-align: center;
  }

  .signature {
    font-family: var(--font-display);
    font-weight: 400;
    font-style: italic;
    font-size: clamp(44px, 4.6vw, 64px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    color: var(--color-fundo-claro);
    margin: 0;
  }
  /* Quicksand doesn't carry a true italic — fall back to a gentle skew
     so the editorial intent reads without introducing a third typeface. */
  .signature em {
    font-style: normal;
    color: var(--color-bege-claro);
    display: inline-block;
    transform: skewX(-6deg);
  }

  .curve {
    width: 180px;
    height: 28px;
    margin: 4px auto 0;
    color: var(--color-alaranjado);
    opacity: 0.85;
  }

  .sub {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 17px;
    line-height: 1.6;
    color: var(--color-bege-claro);
    margin: 0 auto;
    max-width: 440px;
    opacity: 0.92;
  }

  .brand-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: var(--font-body);
    color: rgba(234, 215, 172, 0.55);
  }
  .brand-footer .eyebrow {
    font-size: 10px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .brand-footer .ver {
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-feature-settings: "tnum";
  }

  /* ===== Right — formulário ============================== */
  .form-side {
    background: var(--bg-1);
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 32px 40px 28px;
    position: relative;
  }

  .top-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
  }

  .state-toggle {
    display: inline-flex;
    background: var(--bg-card);
    border: 0.6px solid var(--color-cinza);
    border-radius: var(--radius-pill);
    padding: 4px;
    box-shadow: var(--shadow-sm);
  }
  .state-toggle button {
    appearance: none;
    border: 0;
    background: transparent;
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--color-texto-medio);
    padding: 8px 14px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    white-space: nowrap;
    transition: all var(--duration-fast) var(--ease-soft);
  }
  .state-toggle button[aria-pressed="true"] {
    background: var(--color-bege-claro);
    color: var(--color-texto-escuro);
  }

  .form-center {
    align-self: center;
    justify-self: center;
    width: 100%;
    max-width: 420px;
  }

  .card {
    background: var(--bg-card);
    border: 0.6px solid var(--color-cinza);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 40px 40px 36px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: var(--color-bege);
    font-weight: 500;
    margin: 0 0 -8px;
  }

  .card h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 40px;
    line-height: 1.1;
    color: var(--color-texto-escuro);
    margin: 0;
  }

  .field { display: flex; flex-direction: column; gap: 8px; }

  .field label {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--color-texto-medio);
    font-weight: 500;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input {
    flex: 1;
    width: 100%;
    box-sizing: border-box;
    background: var(--bg-card);
    border: 1px solid var(--color-cinza);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.4;
    color: var(--color-texto-escuro);
    transition: border-color var(--duration-fast) var(--ease-soft),
                box-shadow var(--duration-fast) var(--ease-soft);
  }
  .input::placeholder { color: var(--color-texto-medio); opacity: 0.7; }
  .input:focus {
    outline: none;
    border-color: var(--color-alaranjado);
    box-shadow: 0 0 0 3px rgba(240, 131, 83, 0.15);
  }
  .input.has-trailing { padding-right: 48px; }

  .toggle-pw {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 0;
    border-radius: var(--radius-md);
    color: var(--color-texto-medio);
    cursor: pointer;
    transition: color var(--duration-fast) var(--ease-soft),
                background var(--duration-fast) var(--ease-soft);
  }
  .toggle-pw:hover { color: var(--color-alaranjado); background: var(--color-bege-claro); }
  .toggle-pw svg { width: 18px; height: 18px; }

  .row-meta {
    display: flex;
    justify-content: flex-end;
    margin-top: -8px;
  }
  .link-quiet {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--color-texto-medio);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    white-space: nowrap;
    transition: color var(--duration-fast) var(--ease-soft),
                border-color var(--duration-fast) var(--ease-soft);
  }
  .link-quiet:hover {
    color: var(--color-alaranjado);
    border-bottom-color: var(--color-alaranjado);
  }

  .btn-primary {
    width: 100%;
    background: var(--color-alaranjado);
    color: #FFFFFF;
    border: 0;
    border-radius: var(--radius-md);
    padding: 16px 24px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background var(--duration-fast) var(--ease-soft),
                transform var(--duration-fast) var(--ease-soft);
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--color-tangerina); }
  .btn-primary:active { background: #E47340; }

  /* Error state */
  .error .input { border-color: var(--color-ui-error); }
  .error .input:focus { box-shadow: 0 0 0 3px rgba(192, 80, 74, 0.15); }
  .err-msg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--color-ui-error);
    margin-top: 2px;
  }
  .err-msg svg { width: 14px; height: 14px; flex-shrink: 0; }
  [hidden] { display: none !important; }

  .form-footer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--color-texto-medio);
    opacity: 0.75;
  }
  .form-footer .dot { opacity: 0.5; }

  /* ===== Responsive — stack on narrow viewports ========== */
  @media (max-width: 880px) {
    body { overflow: auto; }
    .split { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
    .brand { padding: 48px 32px; min-height: 360px; }
    .form-side { padding: 24px; }
    .card { padding: 32px 24px; }
  }
</style>
</head>
<body>
  <main class="split" data-screen-label="01 Login">

    <!-- ===== LEFT — brand panel =========================== -->
    <aside class="brand" aria-label="Corporis">
      <div class="brand-mark">
        <img src="assets/logo-branco.png" alt="Corporis Fisioterapia e Pilates"/>
      </div>

      <div class="brand-center">
        <h2 class="signature">
          <em>Movimente-se</em><br/>com propósito.
        </h2>

        <svg class="curve" viewBox="0 0 180 28" fill="none" aria-hidden="true">
          <path d="M2 18 C 40 -2, 80 28, 120 12 S 178 6, 178 6"
                stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <circle cx="178" cy="6" r="2.2" fill="currentColor"/>
        </svg>

        <p class="sub">
          O cuidado da Corporis, agora também na gestão de cada nova aluna.
        </p>
      </div>

      <div class="brand-footer">
        <span class="eyebrow">CRM · acesso interno</span>
        <span class="ver">v 1.0</span>
      </div>
    </aside>

    <!-- ===== RIGHT — login form =========================== -->
    <section class="form-side" aria-label="Formulário de acesso">

      <div class="top-bar">
        <div class="state-toggle" role="group" aria-label="Estado da tela">
          <button type="button" data-state="default" aria-pressed="true">Padrão</button>
          <button type="button" data-state="error" aria-pressed="false">Com erro</button>
        </div>
      </div>

      <div class="form-center">
        <form class="card" id="loginCard" novalidate autocomplete="on">
          <span class="eyebrow">Corporis CRM</span>
          <h1>Entrar</h1>

          <div class="field" id="emailField">
            <label for="email">E-mail</label>
            <div class="input-wrap">
              <input
                class="input"
                type="email"
                id="email"
                name="email"
                placeholder="voce@corporis.com.br"
                autocomplete="username"
                autofocus
              />
            </div>
          </div>

          <div class="field" id="pwField">
            <label for="password">Senha</label>
            <div class="input-wrap">
              <input
                class="input has-trailing"
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Mostrar senha" aria-pressed="false">
                <!-- lucide: eye -->
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="err-msg" id="errMsg" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              E-mail ou senha incorretos.
            </div>
          </div>

          <div class="row-meta">
            <a href="#" class="link-quiet">Esqueci minha senha</a>
          </div>

          <button type="submit" class="btn-primary">Entrar</button>
        </form>
      </div>

      <footer class="form-footer">
        <span>Corporis Fisioterapia e Pilates</span>
        <span class="dot">·</span>
        <span>Xanxerê / SC</span>
      </footer>

    </section>
  </main>

  <script>
    // ===== Password show/hide ============================
    const pwInput  = document.getElementById('password');
    const togglePw = document.getElementById('togglePw');
    const eyeIcon  = document.getElementById('eyeIcon');

    const EYE = `
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>`;
    const EYE_OFF = `
      <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a19.6 19.6 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 7 10 7a19.7 19.7 0 0 1-3.17 4.19"/>
      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
      <line x1="2" y1="2" x2="22" y2="22"/>`;

    togglePw.addEventListener('click', () => {
      const showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      togglePw.setAttribute('aria-pressed', String(!showing));
      togglePw.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
      eyeIcon.innerHTML = showing ? EYE : EYE_OFF;
      pwInput.focus();
    });

    // ===== State toggle (default / error) ================
    const card     = document.getElementById('loginCard');
    const pwField  = document.getElementById('pwField');
    const emailFld = document.getElementById('emailField');
    const errMsg   = document.getElementById('errMsg');
    const toggle   = document.querySelector('.state-toggle');

    function setState(state) {
      const isError = state === 'error';
      pwField.classList.toggle('error', isError);
      emailFld.classList.toggle('error', isError);
      errMsg.hidden = !isError;
      toggle.querySelectorAll('button').forEach(b => {
        b.setAttribute('aria-pressed', String(b.dataset.state === state));
      });
      if (isError) {
        pwInput.value = '••••••';
        document.getElementById('email').value = 'larissa@corporis.com.br';
      }
    }

    toggle.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-state]');
      if (!btn) return;
      setState(btn.dataset.state);
    });

    // Prevent demo form submit
    card.addEventListener('submit', e => e.preventDefault());

    // Focus e-mail field on load (also handled by autofocus attribute,
    // but re-asserted in case the state toggle stole it).
    window.addEventListener('load', () => {
      document.getElementById('email').focus();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 28px 32px; gap: 4px; }
  .line { display: grid; grid-template-columns: 80px 1fr 110px; gap: 18px; align-items: baseline; padding: 10px 0; border-bottom: 1px dashed rgba(58,53,48,0.08); }
  .line:last-child { border-bottom: none; }
  .tok { font-family: var(--font-body); font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--color-bege); }
  .sample { font-family: var(--font-body); color: var(--color-texto-escuro); }
  .meta-r { font-family: var(--font-body); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--color-texto-medio); text-align: right; }
  .lg  { font-size: 19px; font-weight: 500; line-height: 1.55; }
  .md  { font-size: 16px; font-weight: 400; line-height: 1.6; }
  .sm  { font-size: 14px; font-weight: 400; line-height: 1.55; color: var(--color-texto-medio); }
  h3 { font-size: 18px; font-family: var(--font-display); color: var(--color-texto-escuro); margin-bottom: 8px; }
</style>
</head><body>
<div class="card">
  <h3>Body scale — Ubuntu</h3>
  <div class="line"><span class="tok">body-lg</span><span class="sample lg">Atendimento individual em fisioterapia e pilates.</span><span class="meta-r">19 / 500</span></div>
  <div class="line"><span class="tok">body-md</span><span class="sample md">Atendimento individual em fisioterapia e pilates.</span><span class="meta-r">16 / 400</span></div>
  <div class="line"><span class="tok">body-sm</span><span class="sample sm">Atendimento individual em fisioterapia e pilates.</span><span class="meta-r">14 / 400</span></div>
</div>
</body></html>

<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 28px 32px; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .row-pair { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--bg-card); border: 1px solid rgba(58,53,48,0.06); }
  .dot { width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0; }
  .meta-pair { display:flex; flex-direction: column; gap: 2px; }
  .meta-pair .role { font-family: var(--font-body); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-texto-medio); }
  .meta-pair .hex { font-family: var(--font-display); font-size: 13px; color: var(--color-texto-escuro); }
  .header { display:flex; justify-content: space-between; align-items: baseline; }
  h3 { font-size: 22px; }
</style>
</head><body>
<div class="card">
  <div class="header">
    <h3>Functional — UI States</h3>
    <span class="meta">Aliases</span>
  </div>
  <div class="grid">
    <div class="row-pair"><span class="dot" style="background:#F08353"></span><div class="meta-pair"><span class="role">Interactive</span><span class="hex">#F08353</span></div></div>
    <div class="row-pair"><span class="dot" style="background:#F6A958"></span><div class="meta-pair"><span class="role">Hover</span><span class="hex">#F6A958</span></div></div>
    <div class="row-pair"><span class="dot" style="background:#ACC095"></span><div class="meta-pair"><span class="role">Success</span><span class="hex">#ACC095</span></div></div>
    <div class="row-pair"><span class="dot" style="background:#C0504A"></span><div class="meta-pair"><span class="role">Error</span><span class="hex">#C0504A</span></div></div>
    <div class="row-pair"><span class="dot" style="background:#D3D2CD"></span><div class="meta-pair"><span class="role">Border</span><span class="hex">#D3D2CD</span></div></div>
    <div class="row-pair"><span class="dot" style="background:#D3D2CD"></span><div class="meta-pair"><span class="role">Disabled</span><span class="hex">#D3D2CD</span></div></div>
  </div>
</div>
</body></html>

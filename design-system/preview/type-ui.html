<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 28px 32px; gap: 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .item { display:flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border-1); border-radius: var(--radius-sm); }
  .tok { font-family: var(--font-body); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--color-bege); }
  .sample { font-family: var(--font-body); }
  .label  { font-size: 12px; font-weight: 500; letter-spacing: 2.4px; text-transform: uppercase; color: var(--color-texto-escuro); }
  .value  { font-size: 14px; font-weight: 400; color: var(--color-texto-escuro); }
  .micro  { font-size: 10px; font-weight: 400; letter-spacing: 1.6px; text-transform: uppercase; color: var(--color-texto-medio); }
  h3 { font-size: 18px; font-family: var(--font-display); color: var(--color-texto-escuro); }
</style>
</head><body>
<div class="card">
  <h3>UI scale — Ubuntu</h3>
  <div class="row">
    <div class="item">
      <span class="tok">ui-label</span>
      <span class="sample label">Aula Experimental</span>
      <span class="micro" style="letter-spacing:1.2px; color:var(--color-texto-medio)">12 · 500 · +2.4px</span>
    </div>
    <div class="item">
      <span class="tok">ui-value</span>
      <span class="sample value">Rua Coronel Santos Marinho, 347 — Sala 903</span>
      <span class="micro" style="letter-spacing:1.2px; color:var(--color-texto-medio)">14 · 400</span>
    </div>
    <div class="item">
      <span class="tok">ui-micro</span>
      <span class="sample micro">CRP 12 / 88142 · CRP 12 / 91204</span>
      <span class="micro" style="letter-spacing:1.2px; color:var(--color-texto-medio)">10 · 400 · +1.6px</span>
    </div>
  </div>
</div>
</body></html>

<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 32px 36px; gap: 8px; }
  .specimen { font-family: var(--font-display); font-weight: 400; font-size: 96px; line-height: 1; letter-spacing: -0.01em; color: var(--color-alaranjado); }
  .row-info { display:flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid var(--border-1); }
  .row-info span { font-family: var(--font-body); font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--color-texto-medio); }
  .name { font-family: var(--font-body); font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--color-bege); }
</style>
</head><body>
<div class="card">
  <span class="name">Display · Olicy Regular</span>
  <div class="specimen">Aa Gg Qq</div>
  <p style="font-family: var(--font-display); font-size: 26px; color: var(--color-texto-escuro); margin-top: 4px;">Movimente-se com propósito.</p>
  <div class="row-info">
    <span>Regular 400</span>
    <span>Hero · Headlines · Wordmark</span>
    <span>movimento · afeto</span>
  </div>
</div>
</body></html>

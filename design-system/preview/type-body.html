<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 32px 36px; gap: 14px; }
  .specimen { font-family: var(--font-body); font-weight: 400; font-size: 72px; line-height: 1; color: var(--color-texto-escuro); }
  p.body { font-family: var(--font-body); font-size: 16px; line-height: 1.6; color: var(--color-texto-escuro); max-width: 56ch; }
  .row-info { display:flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid var(--border-1); }
  .row-info span { font-family: var(--font-body); font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--color-texto-medio); }
  .name { font-family: var(--font-body); font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--color-bege); }
</style>
</head><body>
<div class="card">
  <span class="name">Body · Ubuntu</span>
  <div class="specimen">Aa Gg Qq</div>
  <p class="body">Atendimento individual em fisioterapia e pilates, no coração de Xanxerê. Ubuntu carrega o corpo da marca — clara, calma, técnica sem ser fria.</p>
  <div class="row-info">
    <span>Regular 400 · Medium 500</span>
    <span>Body · UI · Labels</span>
    <span>legibilidade · segurança</span>
  </div>
</div>
</body></html>

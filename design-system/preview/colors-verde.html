<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 28px 32px; gap: 16px; }
  .row { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: stretch; }
  .sw { background: #ACC095; color: #2A1F1A; border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 132px; }
  .sw .name { font-family: var(--font-display); font-size: 26px; }
  .sw .hex  { font-family: var(--font-body); font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; opacity: 0.85; }
  .note { padding: 14px 16px; border-left: 3px solid #ACC095; background: #F2F5EC; border-radius: 4px; }
  .header { display:flex; justify-content: space-between; align-items: baseline; }
  h3 { font-size: 22px; }
</style>
</head><body>
<div class="card">
  <div class="header">
    <h3>Verde — saúde preventiva</h3>
    <span class="meta">Restricted</span>
  </div>
  <div class="row">
    <div class="sw">
      <div><div class="name">Verde</div><div class="hex" style="margin-top:6px">confiança · juventude</div></div>
      <div class="hex">#ACC095</div>
    </div>
    <div class="note">
      <p class="type-body-sm" style="color:var(--color-texto-escuro)"><strong>Exclusivo</strong> para comunicação de saúde preventiva e fisioterapia pélvica. Também atua como cor de <em>Success</em> em UI. Nunca use decorativamente.</p>
    </div>
  </div>
</div>
</body></html>

<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 28px 32px; gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); padding: 14px 12px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(58,53,48,0.06); }
  .sw .name { font-family: var(--font-display); font-size: 16px; line-height: 1.15; }
  .sw .hex  { font-family: var(--font-body); font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; opacity: 0.85; }
  .fundo   { background: #FAFAF8; color: #3A3530; }
  .cinza   { background: #D3D2CD; color: #3A3530; }
  .texto-m { background: #7A6E68; color: #FAFAF8; }
  .texto-e { background: #3A3530; color: #FAFAF8; }
  .esp     { background: #2A1F1A; color: #FAFAF8; }
  .header { display:flex; justify-content: space-between; align-items: baseline; }
  h3 { font-size: 22px; }
</style>
</head><body>
<div class="card">
  <div class="header">
    <h3>Neutros — base de trabalho</h3>
    <span class="meta">Foundation</span>
  </div>
  <div class="grid">
    <div class="sw fundo">  <div class="name">Fundo Claro</div><div class="hex">#FAFAF8</div></div>
    <div class="sw cinza">  <div class="name">Cinza</div>      <div class="hex">#D3D2CD</div></div>
    <div class="sw texto-m"><div class="name">Texto Médio</div><div class="hex">#7A6E68</div></div>
    <div class="sw texto-e"><div class="name">Texto Escuro</div><div class="hex">#3A3530</div></div>
    <div class="sw esp">    <div class="name">Espresso</div>   <div class="hex">#2A1F1A</div></div>
  </div>
  <p class="type-body-sm">Fundo Claro é o background canônico claro — <strong>nunca</strong> branco puro. Espresso é o canônico escuro — <strong>nunca</strong> preto puro.</p>
</div>
</body></html>

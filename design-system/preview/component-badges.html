<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 32px 36px; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .badge { font-family: var(--font-body); font-weight: 700; font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; padding: 5px 10px; border-radius: 4px; }
  .b-pilates { background: var(--color-alaranjado); color: #FFFFFF; }
  .b-pelvica { background: var(--color-verde); color: #FFFFFF; }
  .b-gest    { background: var(--color-bege); color: var(--color-texto-escuro); }
  .b-novo    { background: var(--color-bege-claro); color: var(--color-texto-escuro); }
  .b-inativo { background: var(--color-cinza); color: var(--color-texto-escuro); }
  h3 { font-size: 18px; font-family: var(--font-display); color: var(--color-texto-escuro); }
</style>
</head><body>
<div class="card">
  <h3>Badges &amp; Labels</h3>
  <div class="row">
    <span class="badge b-pilates">Pilates</span>
    <span class="badge b-pelvica">Fisio Pélvica</span>
    <span class="badge b-gest">Gestantes</span>
    <span class="badge b-novo">Novidade</span>
    <span class="badge b-inativo">Inativo</span>
  </div>
  <p class="type-body-sm">ALL CAPS, +1.8px tracking, radius 4pt, padding 8pt horizontal. Cores derivam do serviço — nunca decorativas.</p>
</div>
</body></html>
